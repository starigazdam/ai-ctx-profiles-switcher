name: test

on:
  push:
    paths:
      - 'ctx.sh'
      - 'ctx.ps1'
      - 'install.ps1'
      - 'src/Ctx/**'
      - 'tests/**'
      - 'openspec/**'
      - '.github/workflows/test.yml'
  pull_request:
    paths:
      - 'ctx.sh'
      - 'ctx.ps1'
      - 'install.ps1'
      - 'src/Ctx/**'
      - 'tests/**'
      - 'openspec/**'
      - '.github/workflows/test.yml'

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      CTX_ENGINE_DLL: ${{ github.workspace }}/src/Ctx/bin/Release/net10.0/Ctx.dll
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Build .NET 10 ctx engine
        run: dotnet build src/Ctx/Ctx.csproj --configuration Release

      - name: Install bats-core
        run: npm install --no-save bats

      - name: Install zsh
        run: sudo apt-get update && sudo apt-get install -y zsh

      - name: Run bats suite (ctx.sh)
        run: ./node_modules/.bin/bats tests/ctx.bats

      - name: Run bats suite (ctx-dotnet)
        run: ./node_modules/.bin/bats tests/ctx-dotnet.bats

      - name: Install Pester
        shell: pwsh
        run: Install-Module Pester -Force -Scope CurrentUser -SkipPublisherCheck -MinimumVersion 5.0

      - name: Run Pester suite (ctx.ps1)
        shell: pwsh
        run: |
          Import-Module Pester -MinimumVersion 5.0
          $cfg = New-PesterConfiguration
          $cfg.Run.Path = 'tests/ctx.Tests.ps1'
          $cfg.Run.Exit = $true
          $cfg.Output.Verbosity = 'Detailed'
          Invoke-Pester -Configuration $cfg

      - name: Run Pester suite (ctx-dotnet)
        shell: pwsh
        run: |
          Import-Module Pester -MinimumVersion 5.0
          $cfg = New-PesterConfiguration
          $cfg.Run.Path = 'tests/ctx-dotnet.Tests.ps1'
          $cfg.Run.Exit = $true
          $cfg.Output.Verbosity = 'Detailed'
          Invoke-Pester -Configuration $cfg

  windows-pester:
    runs-on: windows-latest
    env:
      CTX_ENGINE_DLL: ${{ github.workspace }}/src/Ctx/bin/Release/net10.0/Ctx.dll
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Build .NET 10 ctx engine
        shell: pwsh
        run: dotnet build src/Ctx/Ctx.csproj --configuration Release

      - name: Install Pester
        shell: pwsh
        run: Install-Module Pester -Force -Scope CurrentUser -SkipPublisherCheck -MinimumVersion 5.0

      - name: Run Pester suite on native Windows
        shell: pwsh
        run: |
          Import-Module Pester -MinimumVersion 5.0
          $cfg = New-PesterConfiguration
          $cfg.Run.Path = 'tests/ctx.Tests.ps1'
          $cfg.Run.Exit = $true
          $cfg.Output.Verbosity = 'Detailed'
          Invoke-Pester -Configuration $cfg

      - name: Run Pester suite on native Windows (ctx-dotnet)
        shell: pwsh
        run: |
          Import-Module Pester -MinimumVersion 5.0
          $cfg = New-PesterConfiguration
          $cfg.Run.Path = 'tests/ctx-dotnet.Tests.ps1'
          $cfg.Run.Exit = $true
          $cfg.Output.Verbosity = 'Detailed'
          Invoke-Pester -Configuration $cfg

  openspec-validate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Validate OpenSpec proposals
        run: npm exec --yes --package=@fission-ai/openspec@1.13.2 -- openspec validate --all --strict
